<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>cindyho.work | Projects</title>
  <meta name="description" content="Cindy Ho projects hub" />
  <style>
    :root{
      --text: #0f1b2d;
      --text-soft: rgba(15,27,45,0.68);
      --card-bg: rgba(255,255,255,0.86);
      --card-border: rgba(15,27,45,0.12);
      --accent: #1d4ed8;
      --accent-soft: rgba(29,78,216,0.12);
      --shadow: 0 18px 48px rgba(15,27,45,0.12);
      --radius-xl: 28px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; }

    body{
      margin: 0;
      min-height: 100vh;
      font-family:
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        ui-sans-serif,
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
      color: var(--text);
      background: #f6f7fb;
    }

    body::before{
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 12% 20%, rgba(29,78,216,0.08), transparent 40%),
        radial-gradient(circle at 88% 18%, rgba(15,27,45,0.08), transparent 38%),
        url("./image/pic1.jpg") center top / cover no-repeat;
      opacity: 0.12;
      z-index: -2;
    }

    .page{
      width: min(1180px, calc(100% - 48px));
      margin: 0 auto;
      padding: 54px 0 80px;
    }

    .hero{
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 32px;
    }

    .hero h1{
      margin: 0 0 12px;
      font-size: clamp(32px, 3.8vw, 54px);
      letter-spacing: 0.06em;
    }

    .hero p{
      margin: 0;
      font-size: 14px;
      color: var(--text-soft);
      max-width: 520px;
      line-height: 1.7;
    }

    .hero .tag{
      font-size: 12px;
      letter-spacing: 0.28em;
      color: rgba(15,27,45,0.54);
    }

    .grid{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .card{
      border-radius: var(--radius-xl);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      padding: 22px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card h3{
      margin: 0;
      font-size: 20px;
    }

    .card p{
      margin: 0;
      color: var(--text-soft);
      line-height: 1.6;
      font-size: 13px;
    }

    .links{
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      font-size: 12px;
      border-radius: 999px;
      border: 1px solid rgba(29,78,216,0.2);
      background: var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    .btn.secondary{
      border-color: rgba(15,27,45,0.18);
      color: #0f1b2d;
      background: rgba(15,27,45,0.06);
    }

    .footer{
      margin-top: 28px;
      color: rgba(15,27,45,0.5);
      font-size: 12px;
    }

    @media (max-width: 720px){
      .hero{
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
    <main class="page">
    <section class="hero">
      <div>
        <div class="tag">PROJECTS HUB</div>
        <h1>cindyho.work</h1>
        <p>這裡是我的專案首頁入口，整理目前對外展示的作品。</p>
      </div>
    </section>

    <section class="grid">
      <article class="card">
        <h3>不動產資訊查詢平台(台南市篇)</h3>
        <p>整合使用執照、實價登錄、生活機能與預售屋資訊，支援地圖與地址查詢。</p>
        <div class="links">
          <a class="btn" href="tnhouse.html">專案首頁</a>
        </div>
      </article>

      <article class="card">
        <h3>更多專案</h3>
        <p>後續作品會陸續補上，敬請期待。</p>
      </article>
    </section>

    <div class="footer">© cindyho.work</div>
  </main>
</body>
</html>
