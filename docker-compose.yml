services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tn_db
    environment:
      POSTGRES_USER: tn
      POSTGRES_PASSWORD: tn
      POSTGRES_DB: tn_house
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tn -d tn_house"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./apps/api
    container_name: tn_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
      - ./data:/data:ro
    working_dir: /app
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy


  etl:
    build:
      context: ./etl
    container_name: tn_etl
    env_file:
      - .env
    volumes:
      - ./etl:/app
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
